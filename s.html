<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shooting Hours — Shared Dates</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding: 3rem 1.5rem 4rem;
    line-height: 1.6;
    color: #1c1c1e;
    text-align: center;
  }
  h1 {
    font-size: 1.5rem;
    margin-bottom: 0.5rem;
  }
  p {
    color: #3a3a3c;
  }
  .open-button {
    display: inline-block;
    margin-top: 1.75rem;
    padding: 0.9rem 2rem;
    background: #16213E;
    color: #fff;
    text-decoration: none;
    border-radius: 999px;
    font-weight: 600;
    font-size: 1.05rem;
  }
  .no-app {
    margin-top: 2.5rem;
    font-size: 0.9rem;
    color: #6e6e73;
  }
  .error {
    color: #c1395c;
  }
</style>
</head>
<body>

<h1 id="heading">Shooting dates have been shared with you</h1>
<p id="subtext">Tap below to open them in Shooting Hours.</p>

<a id="openButton" class="open-button" href="#">Open in Shooting Hours</a>

<p class="no-app">Don't have Shooting Hours yet? Download it from the App Store, then come back and tap this link again.</p>

<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var data = params.get("d");
    var heading = document.getElementById("heading");
    var subtext = document.getElementById("subtext");
    var openButton = document.getElementById("openButton");

    if (!data) {
      heading.textContent = "This link is missing its data";
      heading.className = "error";
      subtext.textContent = "Ask whoever sent it to try sharing again.";
      openButton.style.display = "none";
      return;
    }

    openButton.href = "shootinghours://import?data=" + encodeURIComponent(data);

    // Best-effort: decode just enough to show a friendlier subtitle. Falls
    // back to the generic message above if the payload doesn't parse —
    // the app itself does the real decoding, this is cosmetic only.
    try {
      var json = JSON.parse(atob(data));
      var days = json.days || [];
      var count = days.length;
      var dateWord = count === 1 ? "date" : "dates";
      var firstName = days.length ? days[0].categoryName : null;
      var sameName = firstName && days.every(function (d) { return d.categoryName === firstName; });
      subtext.textContent = sameName
        ? firstName + " — " + count + " " + dateWord + ". Tap below to add them."
        : count + " shooting " + dateWord + ". Tap below to add them.";
    } catch (e) {
      // Keep the generic subtext.
    }
  })();
</script>

</body>
</html>
